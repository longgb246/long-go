
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐进围棋 - 专业AI对弈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background-color: #fdfaf5;
            color: #2c2c2c;
            overflow-x: hidden;
        }
        .chinese-font {
            font-family: 'Ma Shan Zheng', cursive;
        }
        .shanshui-bg {
            /* 更加明亮的山水背景，符合用户要求的亮色调 */
            background: linear-gradient(to bottom, rgba(253, 250, 245, 0.8), rgba(253, 250, 245, 0.6)),
                        url('https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .board-bg {
            /* 优化木质棋盘纹理 */
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern-2.png');
            background-color: #e6c07b;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.4), inset 0 0 120px rgba(0,0,0,0.15);
            border: 2px solid #8b7355;
        }
        .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
        }
        /* 提升整体亮度感 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(139, 115, 85, 0.2);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="shanshui-bg paper-texture">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
