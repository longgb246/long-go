# KataGo GTP 配置文件
# 优化配置：GPU 优先，自动降级到 CPU

# ============================================
# 日志设置
# ============================================
logAllGTPCommunication = false
logSearchInfo = true
logToStderr = true
logFile = katago.log

# ============================================
# 后端设置（GPU 优先，失败自动降级到 CPU）
# ============================================
# KataGo 会自动尝试以下顺序：
# 1. CUDA（如果有 NVIDIA GPU）
# 2. OpenCL（如果有 AMD/Intel GPU 或 Mac 独立显卡）
# 3. Eigen（CPU 后端，作为最终降级选项）

# OpenCL 设置（Mac 和 AMD GPU）
# 如果检测到 OpenCL 设备，将优先使用
# openclGpuToUse = 0
# openclDeviceToUse = 0
# openclPlatformToUse = 0

# CUDA 设置（NVIDIA GPU）
# 如果检测到 CUDA 设备，将优先使用
# cudaGpuToUse = 0
# cudaUseFP16 = true
# cudaUseNHWC = true

# ============================================
# 搜索设置 - 平衡速度和质量
# ============================================
maxVisits = 500
maxPlayouts = 500000
maxTime = 10.0

# 线程设置（根据 CPU 核心数调整）
# Mac 通常有 8-16 个核心
numSearchThreads = 8
numAnalysisThreads = 8
numGameThreads = 8

# ============================================
# 神经网络设置 - 性能优化
# ============================================
# 缓存大小（2^21 = 2M 条目，约 512MB）
nnCacheSizePowerOfTwo = 21

# 批处理大小（GPU 可以更大，CPU 建议 8-16）
nnMaxBatchSize = 32

# 互斥池大小（提高并发性能）
nnMutexPoolSize = 256

# ============================================
# 规则设置
# ============================================
# 使用中国规则（包含所有子规则）
rules = chinese

# ============================================
# 分析设置 - 增加多样性
# ============================================
# 根节点噪声（增加候选着法多样性）
analysisWideRootNoise = 0.15

# 温度设置（控制随机性）
chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.10

# ============================================
# 性能优化
# ============================================
# 对称性修剪
rootSymmetryPruning = true

# 使用不确定性
useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

# FPU 减少（鼓励探索）
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1

# 策略乐观性
rootPolicyOptimism = 0.2
policyOptimism = 1.0

# ============================================
# 其他设置
# ============================================
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3

# 时间控制
lagBuffer = 1.0

# ============================================
# 说明
# ============================================
# GPU 优先级：
# 1. 如果有 NVIDIA GPU，KataGo 会自动使用 CUDA
# 2. 如果有 AMD/Intel GPU 或 Mac 独立显卡，会使用 OpenCL
# 3. 如果 GPU 初始化失败，会自动降级到 CPU（Eigen）
# 
# 性能提示：
# - GPU 版本：可以将 maxVisits 增加到 1000-2000
# - CPU 版本：建议保持 maxVisits 在 500 左右
# - 调整 numSearchThreads 为你的 CPU 核心数
